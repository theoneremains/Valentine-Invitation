<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/heart-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💖 DKTT Konseri Davetiyesi</title>
    <meta name="description" content="Romantik bir DKTT konseri davetiyesi - Benimle gelir misin?" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="💖 DKTT Konseri Davetiyesi" />
    <meta property="og:description" content="Romantik bir DKTT konseri davetiyesi - Benimle gelir misin?" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-username.github.io/Valentine" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="💖 DKTT Konseri Davetiyesi" />
    <meta name="twitter:description" content="Romantik bir DKTT konseri davetiyesi - Benimle gelir misin?" />

    <!-- Preload fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* Loading screen styles */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff6b9d, #ff8a80, #ffc1cc);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        #loading.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loading-heart {
            width: 60px;
            height: 54px;
            position: relative;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        .loading-heart:before,
        .loading-heart:after {
            content: '';
            width: 30px;
            height: 48px;
            position: absolute;
            left: 30px;
            transform: rotate(-45deg);
            background: #fff;
            border-radius: 30px 30px 0 0;
            transform-origin: 0 100%;
        }

        .loading-heart:after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }

        .loading-text {
            color: white;
            font-family: 'Dancing Script', cursive;
            font-size: 24px;
            margin-top: 20px;
            opacity: 0.8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading">
        <div class="loading-heart"></div>
        <div class="loading-text">Aşk yükleniyor...</div>
    </div>

    <!-- Main App -->
    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>

    <script>
        // Remove loading screen after a delay
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loading = document.getElementById('loading');
                loading.classList.add('fade-out');
                setTimeout(function() {
                    loading.style.display = 'none';
                }, 500);
            }, 1500);
        });
    </script>
</body>
</html>
