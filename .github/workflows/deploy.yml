name: Deploy Valentine Invitation to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 💖 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: |
          echo "Installing dependencies..."
          npm ci
          echo "Dependencies installed successfully!"

      - name: 🔍 Debug - Show project structure
        run: |
          echo "Current directory contents:"
          ls -la
          echo "Package.json scripts:"
          cat package.json | grep -A 10 '"scripts"'
          echo "Node and npm versions:"
          node --version
          npm --version

      - name: 🏗️ Build project
        run: |
          echo "Building project for production..."
          echo "NODE_ENV=production"
          export NODE_ENV=production
          npm run build
          echo "Build completed!"

      - name: 📄 Add .nojekyll file
        run: |
          echo "Adding .nojekyll file to prevent GitHub Pages Jekyll processing..."
          touch dist/.nojekyll
          echo "✅ .nojekyll file added"

      - name: 📁 Verify build output
        run: |
          echo "Build output verification:"
          ls -la
          if [ -d "dist" ]; then
            echo "✅ dist folder exists"
            echo "Contents of dist folder:"
            ls -la dist/
            echo "Checking for index.html:"
            if [ -f "dist/index.html" ]; then
              echo "✅ index.html exists in dist"
              echo "First few lines of index.html:"
              head -10 dist/index.html
            else
              echo "❌ index.html missing in dist folder"
              exit 1
            fi
          else
            echo "❌ dist folder not found"
            exit 1
          fi

      - name: 🔧 Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 🎉 Deployment success
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "💖 Your romantic invitation should be available at:"
          echo "${{ steps.deployment.outputs.page_url }}"
